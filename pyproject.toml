[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ops-reliability-lab"
version = "1.0.0"
description = "Synthetic reliability lab for auditable, human-safe AI operations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Vinicius Castello Branco" }
]
keywords = [
  "ai-operations",
  "cloud-operations",
  "reliability-engineering",
  "human-in-the-loop",
  "observability",
  "audit-trail",
  "guardrails"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Monitoring"
]
dependencies = []

[project.scripts]
ai-ops-lab = "ai_ops_reliability.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
